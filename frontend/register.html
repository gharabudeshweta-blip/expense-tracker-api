<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Create account</h1>
  <form id="register-form" class="auth-form">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>
  <p id="message"></p>
  <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>

  <script>
    const API = "http://127.0.0.1:5000";

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = document.getElementById("message");
      message.style.color = "#b3261e";

      try {
        const response = await fetch(API + "/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await response.json();

        if (response.ok) {
          message.style.color = "#1e7a3c";
          message.textContent = "Account created! Taking you to login...";
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        } else {
          message.textContent = data.error || "Registration failed.";
        }
      } catch (error) {
        message.textContent = "Cannot reach the server. Is Flask running?";
      }
    });
  </script>
</body>
</html>
